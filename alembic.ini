# Alembic configuration for Production Readiness Lab.
# Run all alembic commands from the repository root.
# The database URL is read from the DATABASE_URL environment variable in env.py;
# the sqlalchemy.url entry below is intentionally left as a placeholder and is
# never used directly — env.py overrides it at runtime.

[alembic]
script_location = src/backend/migrations
file_template = %%(year)d%%(month).2d%%(day).2d_%%(hour).2d%%(minute).2d_%%(rev)s_%%(slug)s
prepend_sys_path = .
path_separator = os
truncate_slug_length = 40

# Placeholder — overridden by env.py from DATABASE_URL environment variable.
# Never commit real credentials here.
sqlalchemy.url = mysql+asyncmy://user:password@localhost:3306/production_readiness_lab

[post_write_hooks]

[loggers]
keys = root, sqlalchemy, alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
