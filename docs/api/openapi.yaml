  /api/v1/auth/logout:
    post:
      description: 'Origin or acceptable Referer is always required, including repeated
        logout.


        Valid sessions require matching signed prl_csrf cookie and X-CSRF-Token header.

        Missing/invalid sessions return 204 and clear cookies after origin validation.'
      operationId: logout_api_v1_auth_logout_post
      parameters:
      - description: Signed token matching prl_csrf; required for a valid session
        in: header
        name: x-csrf-token
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          description: Signed token matching prl_csrf; required for a valid session
          title: X-Csrf-Token
      responses:
