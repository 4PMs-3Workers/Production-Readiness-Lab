components:
  schemas:
    CsrfResponse:
      properties:
        csrf_token:
          title: Csrf Token
          type: string
      required:
      - csrf_token
      title: CsrfResponse
      type: object
    ErrorDetail:
      properties:
        code:
          title: Code
          type: string
        message:
          title: Message
          type: string
        request_id:
          title: Request Id
          type: string
      required:
      - code
      - message
      - request_id
      title: ErrorDetail
      type: object
    ErrorResponse:
      properties:
        error:
          $ref: '#/components/schemas/ErrorDetail'
      required:
      - error
      title: ErrorResponse
      type: object
    LiveResponse:
      properties:
        status:
          const: live
          title: Status
          type: string
      required:
      - status
      title: LiveResponse
      type: object
    LoginRequest:
      additionalProperties: false
      properties:
        email:
          title: Email
          type: string
        password:
          format: password
          maxLength: 1024
          minLength: 1
          title: Password
          type: string
          writeOnly: true
      required:
      - email
      - password
      title: LoginRequest
      type: object
    PageResponse_PurposeItem_:
      properties:
        items:
          items:
            $ref: '#/components/schemas/PurposeItem'
          title: Items
          type: array
        page:
          minimum: 1.0
          title: Page
          type: integer
        page_size:
          maximum: 100.0
          minimum: 1.0
          title: Page Size
          type: integer
        total:
          minimum: 0.0
          title: Total
          type: integer
      required:
      - items
      - page
      - page_size
      - total
      title: PageResponse[PurposeItem]
      type: object
    PageResponse_StaffItem_:
      properties:
        items:
          items:
            $ref: '#/components/schemas/StaffItem'
          title: Items
          type: array
        page:
          minimum: 1.0
          title: Page
          type: integer
        page_size:
          maximum: 100.0
          minimum: 1.0
          title: Page Size
          type: integer
        total:
          minimum: 0.0
          title: Total
          type: integer
      required:
      - items
      - page
      - page_size
      - total
      title: PageResponse[StaffItem]
      type: object
    PublicUser:
      properties:
        email:
          title: Email
          type: string
        id:
          format: uuid
          title: Id
          type: string
        name:
          title: Name
          type: string
        role:
          enum:
          - STUDENT
          - STAFF
          - ADMIN
          title: Role
          type: string
      required:
      - id
      - email
      - name
      - role
      title: PublicUser
      type: object
    PurposeItem:
      properties:
        code:
          title: Code
          type: string
        duration_minutes:
          title: Duration Minutes
          type: integer
        id:
          format: uuid
          title: Id
          type: string
        name:
          title: Name
          type: string
        requires_free_text:
          title: Requires Free Text
          type: boolean
      required:
      - id
      - code
      - name
      - duration_minutes
      - requires_free_text
      title: PurposeItem
      type: object
    ReadyResponse:
      properties:
        status:
          const: ready
          title: Status
          type: string
      required:
      - status
      title: ReadyResponse
      type: object
    StaffItem:
      properties:
        id:
          format: uuid
          title: Id
          type: string
        name:
          title: Name
          type: string
      required:
      - id
      - name
      title: StaffItem
      type: object
  securitySchemes:
    prl_session:
      in: cookie
      name: prl_session
      type: apiKey
