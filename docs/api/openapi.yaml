      type: object
    PageResponse_StaffItem_:
      properties:
        items:
          items:
            $ref: '#/components/schemas/StaffItem'
          title: Items
          type: array
        page:
          minimum: 1.0
          title: Page
          type: integer
        page_size:
          maximum: 100.0
          minimum: 1.0
          title: Page Size
          type: integer
        total:
          minimum: 0.0
          title: Total
          type: integer
      required:
      - items
      - page
      - page_size
      - total
      title: PageResponse[StaffItem]
      type: object
    PageResponse_StaffPurposeResponse_:
      properties:
        items:
          items:
            $ref: '#/components/schemas/StaffPurposeResponse'
          title: Items
          type: array
        page:
          minimum: 1.0
          title: Page
          type: integer
        page_size:
          maximum: 100.0
          minimum: 1.0
          title: Page Size
          type: integer
        total:
          minimum: 0.0
          title: Total
          type: integer
      required:
      - items
      - page
      - page_size
      - total
      title: PageResponse[StaffPurposeResponse]
      type: object
    PageResponse_UnavailabilityResponse_:
      properties:
        items:
          items:
            $ref: '#/components/schemas/UnavailabilityResponse'
          title: Items
          type: array
        page:
          minimum: 1.0
          title: Page
          type: integer
        page_size:
          maximum: 100.0
          minimum: 1.0
          title: Page Size
          type: integer
        total:
          minimum: 0.0
          title: Total
          type: integer
      required:
      - items
      - page
      - page_size
      - total
      title: PageResponse[UnavailabilityResponse]
      type: object
    ProposalContext:
      properties:
        appointment_id:
          format: uuid
          title: Appointment Id
          type: string
        appointment_status:
          enum:
          - UPCOMING
          - CHANGE_PENDING
          - CANCELLED
          - COMPLETED
          - NO_SHOW
          title: Appointment Status
          type: string
        pending_proposal_id:
          anyOf:
          - format: uuid
            type: string
          - type: 'null'
          title: Pending Proposal Id
        proposal_version:
          title: Proposal Version
          type: integer
      required:
      - appointment_id
      - appointment_status
      - proposal_version
      - pending_proposal_id
      title: ProposalContext
      type: object
    ProposalCreateReceipt:
      additionalProperties: false
      properties:
        appointment_id:
          format: uuid
          title: Appointment Id
          type: string
        created_at:
          $ref: '#/components/schemas/UtcTimestamp'
        created_version:
          title: Created Version
          type: integer
        expires_at:
          $ref: '#/components/schemas/UtcTimestamp'
        id:
          format: uuid
          title: Id
          type: string
      required:
      - id
      - appointment_id
      - created_version
      - created_at
      - expires_at
      title: ProposalCreateReceipt
      type: object
    ProposalCreateRequest:
      additionalProperties: false
      properties:
        expected_pending_proposal_id:
          anyOf:
          - format: uuid
            type: string
          - type: 'null'
          title: Expected Pending Proposal Id
        expected_proposal_version:
          maximum: 9007199254740991.0
          minimum: 0.0
          title: Expected Proposal Version
          type: integer
        proposed_location:
          anyOf:
          - maxLength: 500
            type: string
          - type: 'null'
          title: Proposed Location
        proposed_starts_at:
          format: date-time
          title: Proposed Starts At
          type: string
      required:
      - expected_proposal_version
      - expected_pending_proposal_id
      - proposed_starts_at
      - proposed_location
      title: ProposalCreateRequest
      type: object
    ProposalDecisionRequest:
      additionalProperties: false
      properties: {}
      title: ProposalDecisionRequest
      type: object
    ProposalHistoryItem:
      additionalProperties: false
      properties:
        appointment_id:
          format: uuid
          title: Appointment Id
          type: string
        created_at:
          $ref: '#/components/schemas/UtcTimestamp'
        created_by:
          format: uuid
          title: Created By
          type: string
        created_version:
          anyOf:
          - type: integer
          - type: 'null'
          title: Created Version
        expires_at:
          $ref: '#/components/schemas/UtcTimestamp'
        id:
          format: uuid
          title: Id
          type: string
        proposed_ends_at:
          $ref: '#/components/schemas/UtcTimestamp'
        proposed_location:
          anyOf:
          - type: string
          - type: 'null'
          title: Proposed Location
        proposed_starts_at:
          $ref: '#/components/schemas/UtcTimestamp'
        resolved_at:
          anyOf:
          - $ref: '#/components/schemas/UtcTimestamp'
          - type: 'null'
        resolved_by:
          anyOf:
          - format: uuid
            type: string
          - type: 'null'
          title: Resolved By
        status:
          enum:
          - PENDING
          - ACCEPTED
          - DECLINED
          - EXPIRED
          - SUPERSEDED
          - CANCELLED
          title: Status
          type: string
      required:
      - id
      - appointment_id
      - created_by
      - created_version
      - proposed_starts_at
      - proposed_ends_at
      - proposed_location
      - status
      - created_at
      - expires_at
      - resolved_at
      - resolved_by
      title: ProposalHistoryItem
      type: object
    ProposalHistoryResponse:
