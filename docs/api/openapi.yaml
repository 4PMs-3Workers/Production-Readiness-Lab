components:
  schemas:
    AppointmentCancelRequest:
      additionalProperties: false
      properties:
        reason:
          anyOf:
          - maxLength: 2000
            type: string
          - type: 'null'
          title: Reason
      title: AppointmentCancelRequest
      type: object
    AppointmentCancelResponse:
      additionalProperties: false
      properties:
        cancelled_at:
          format: date-time
          title: Cancelled At
          type: string
        id:
          format: uuid
          title: Id
          type: string
        status:
          const: CANCELLED
          title: Status
          type: string
      required:
      - id
      - status
      - cancelled_at
      title: AppointmentCancelResponse
      type: object
    AppointmentCreateRequest:
      additionalProperties: false
      properties:
        description:
          anyOf:
          - maxLength: 2000
            type: string
          - type: 'null'
          title: Description
        purpose_id:
          format: uuid
          title: Purpose Id
          type: string
        staff_id:
          format: uuid
          title: Staff Id
          type: string
        starts_at:
          format: date-time
          title: Starts At
          type: string
      required:
      - purpose_id
      - staff_id
      - starts_at
      title: AppointmentCreateRequest
      type: object
    AppointmentCreateResponse:
      additionalProperties: false
      description: Original creation receipt returned on both create and idempotent
        replay.
      properties:
        created_at:
          format: date-time
          title: Created At
          type: string
        id:
          format: uuid
          title: Id
          type: string
        status:
          const: UPCOMING
          title: Status
          type: string
      required:
      - id
      - status
      - created_at
      title: AppointmentCreateResponse
      type: object
    AppointmentDetailResponse:
      additionalProperties: false
      description: Current owned detail including description and cancellation information.
      properties:
        cancel_reason:
          anyOf:
          - type: string
          - type: 'null'
          title: Cancel Reason
        cancelled_at:
          anyOf:
          - $ref: '#/components/schemas/UtcTimestamp'
          - type: 'null'
        created_at:
          $ref: '#/components/schemas/UtcTimestamp'
        description:
          anyOf:
          - type: string
          - type: 'null'
          title: Description
        duration_minutes:
          title: Duration Minutes
          type: integer
        ends_at:
          $ref: '#/components/schemas/UtcTimestamp'
        id:
          format: uuid
          title: Id
          type: string
        location:
          anyOf:
          - type: string
          - type: 'null'
          title: Location
        purpose_code:
          title: Purpose Code
          type: string
        purpose_id:
          format: uuid
          title: Purpose Id
          type: string
        purpose_name:
          title: Purpose Name
          type: string
        staff_id:
          format: uuid
          title: Staff Id
          type: string
        staff_name:
          title: Staff Name
          type: string
        starts_at:
          $ref: '#/components/schemas/UtcTimestamp'
        status:
          enum:
          - UPCOMING
          - CHANGE_PENDING
          - CANCELLED
          - COMPLETED
          - NO_SHOW
          title: Status
          type: string
      required:
      - id
      - purpose_id
      - purpose_code
      - purpose_name
      - staff_id
      - staff_name
      - duration_minutes
      - starts_at
      - ends_at
      - location
      - status
      - created_at
      - description
      - cancelled_at
      - cancel_reason
      title: AppointmentDetailResponse
      type: object
    AppointmentListItem:
      additionalProperties: false
      description: Student-visible history fields, excluding private persistence metadata.
      properties:
        created_at:
          $ref: '#/components/schemas/UtcTimestamp'
        duration_minutes:
          title: Duration Minutes
          type: integer
        ends_at:
          $ref: '#/components/schemas/UtcTimestamp'
        id:
          format: uuid
          title: Id
          type: string
        location:
          anyOf:
          - type: string
          - type: 'null'
          title: Location
        purpose_code:
          title: Purpose Code
          type: string
        purpose_id:
          format: uuid
          title: Purpose Id
          type: string
        purpose_name:
          title: Purpose Name
          type: string
        staff_id:
          format: uuid
          title: Staff Id
          type: string
        staff_name:
          title: Staff Name
          type: string
        starts_at:
          $ref: '#/components/schemas/UtcTimestamp'
        status:
          enum:
          - UPCOMING
          - CHANGE_PENDING
          - CANCELLED
          - COMPLETED
          - NO_SHOW
          title: Status
          type: string
      required:
      - id
      - purpose_id
      - purpose_code
      - purpose_name
      - staff_id
      - staff_name
      - duration_minutes
      - starts_at
      - ends_at
      - location
      - status
      - created_at
      title: AppointmentListItem
      type: object
    AvailabilityResponse:
      properties:
        date:
          format: date
          title: Date
          type: string
        slots:
          items:
            $ref: '#/components/schemas/AvailableSlot'
          title: Slots
          type: array
        timezone:
          title: Timezone
          type: string
      required:
      - date
      - timezone
      - slots
      title: AvailabilityResponse
      type: object
    AvailableSlot:
      properties:
        ends_at:
          $ref: '#/components/schemas/UtcTimestamp'
        starts_at:
          $ref: '#/components/schemas/UtcTimestamp'
      required:
      - starts_at
      - ends_at
      title: AvailableSlot
      type: object
    BookingContextResponse:
      properties:
        business_date:
          format: date
          title: Business Date
          type: string
        max_booking_date:
          format: date
          title: Max Booking Date
          type: string
        min_booking_date:
          format: date
          title: Min Booking Date
          type: string
        timezone:
          title: Timezone
          type: string
      required:
      - timezone
      - business_date
      - min_booking_date
      - max_booking_date
      title: BookingContextResponse
      type: object
    CsrfResponse:
      properties:
        csrf_token:
          title: Csrf Token
          type: string
        user_id:
          format: uuid
          title: User Id
          type: string
      required:
      - csrf_token
      - user_id
      title: CsrfResponse
      type: object
    ErrorDetail:
      properties:
        code:
          title: Code
          type: string
        message:
          title: Message
          type: string
        request_id:
          title: Request Id
          type: string
      required:
      - code
      - message
      - request_id
      title: ErrorDetail
      type: object
    ErrorResponse:
      properties:
        error:
          $ref: '#/components/schemas/ErrorDetail'
      required:
      - error
      title: ErrorResponse
      type: object
    LiveResponse:
      properties:
        status:
          const: live
          title: Status
          type: string
      required:
      - status
      title: LiveResponse
      type: object
    LoginRequest:
      additionalProperties: false
      properties:
        email:
          title: Email
          type: string
        password:
          format: password
          maxLength: 1024
          minLength: 1
          title: Password
          type: string
          writeOnly: true
      required:
      - email
      - password
      title: LoginRequest
      type: object
    PageResponse_AppointmentListItem_:
      properties:
        items:
          items:
            $ref: '#/components/schemas/AppointmentListItem'
          title: Items
          type: array
        page:
          minimum: 1.0
          title: Page
          type: integer
        page_size:
          maximum: 100.0
          minimum: 1.0
          title: Page Size
          type: integer
        total:
          minimum: 0.0
          title: Total
          type: integer
      required:
      - items
      - page
      - page_size
      - total
      title: PageResponse[AppointmentListItem]
      type: object
    PageResponse_PurposeItem_:
      properties:
        items:
          items:
            $ref: '#/components/schemas/PurposeItem'
          title: Items
          type: array
        page:
          minimum: 1.0
          title: Page
          type: integer
        page_size:
          maximum: 100.0
          minimum: 1.0
          title: Page Size
          type: integer
        total:
          minimum: 0.0
          title: Total
          type: integer
      required:
      - items
      - page
      - page_size
      - total
      title: PageResponse[PurposeItem]
      type: object
    PageResponse_StaffAppointmentListItem_:
