[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "prl-offhost-probe"
version = "0.1.0"
description = "Independent bounded HTTPS monitor for Production Readiness Lab"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
offhost-probe = "offhost_probe.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["offhost_probe*"]
