proxy_http_version 1.1;
proxy_set_header Connection "";
proxy_set_header Host $http_host;
proxy_set_header Origin $http_origin;
proxy_set_header Referer $http_referer;
proxy_set_header Cookie $http_cookie;
proxy_set_header X-CSRF-Token $http_x_csrf_token;
proxy_set_header Idempotency-Key $http_idempotency_key;
proxy_set_header X-Request-ID $request_id;
# Never append or consume client-provided forwarding metadata.
proxy_set_header Forwarded "";
proxy_set_header X-Real-IP "";
proxy_set_header X-Forwarded-For $remote_addr;
proxy_set_header X-Forwarded-Host $http_host;
proxy_set_header X-Forwarded-Proto $scheme;
proxy_set_header X-Forwarded-Port "";
proxy_connect_timeout 2s;
proxy_send_timeout 10s;
# Greater than the API's 3s application deadline so its error can arrive.
proxy_read_timeout 10s;
proxy_cache off;
proxy_store off;
proxy_intercept_errors off;
proxy_hide_header X-Request-ID;
proxy_hide_header X-PRL-Route;
proxy_hide_header X-PRL-Outcome;
# Cookie/Set-Cookie, Retry-After, Cache-Control and X-Error-Class pass unchanged.
