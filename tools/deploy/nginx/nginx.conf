worker_processes auto;
pid /tmp/nginx.pid;
error_log /dev/stderr crit;

events { worker_connections 512; }

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    server_tokens off;
    # $uri excludes the query string. Never log request headers or bodies.
    log_format safe escape=json '{"request_id":"$request_id","method":"$request_method","path":"$uri","status":$status,"duration":$request_time}';
    access_log /dev/stdout safe;
    client_body_temp_path /tmp/client_body;
    proxy_temp_path /tmp/proxy;
    fastcgi_temp_path /tmp/fastcgi;
    uwsgi_temp_path /tmp/uwsgi;
    scgi_temp_path /tmp/scgi;
    client_header_timeout 10s;
    client_body_timeout 10s;
    send_timeout 10s;
    keepalive_timeout 15s;
    client_body_buffer_size 32k;
    client_max_body_size 32768;
    resolver 127.0.0.11 valid=10s ipv6=off;
    limit_req_zone $binary_remote_addr zone=login:10m rate=30r/m;
    limit_req_status 429;
    include /etc/nginx/server.conf;
}
