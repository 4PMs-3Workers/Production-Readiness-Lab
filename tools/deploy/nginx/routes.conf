add_header X-Request-ID $request_id always;
default_type application/json;
error_page 400 414 431 = /__prl/error/bad-request;
error_page 408 = @timeout;
error_page 413 = @too_large;
error_page 429 = @throttled;
error_page 500 502 503 504 = @unavailable;
set $prl_handler "none";

location = /health/gateway {
    return 200 '{"status":"ok"}';
}

location ~ ^/api/v1/auth/login/?$ {
    client_max_body_size 4096;
    limit_req zone=login burst=10 nodelay;
    include /etc/nginx/prl/proxy.conf;
    # Fixed API address avoids choosing its shared frontend/proxy interface.
    proxy_pass http://172.30.34.3:8000;
}

location = /api/v1 {
    include /etc/nginx/prl/proxy.conf;
    proxy_pass http://172.30.34.3:8000;
}

location /api/v1/ {
    include /etc/nginx/prl/proxy.conf;
    proxy_pass http://172.30.34.3:8000;
}

location = /health/live {
    include /etc/nginx/prl/proxy.conf;
    proxy_pass http://172.30.34.3:8000;
}

location = /health/ready {
    include /etc/nginx/prl/proxy.conf;
    proxy_pass http://172.30.34.3:8000;
}

location / {
    include /etc/nginx/prl/proxy.conf;
    set $frontend http://frontend:3000;
    proxy_pass $frontend;
}

location = /__prl/error/bad-request {
    internal;
    set $prl_handler "gateway_input";
    include /etc/nginx/prl/error-input.conf;
    return 400 '{"error":{"code":"HTTP_ERROR","message":"Request rejected","request_id":"$request_id"}}';
}
location @timeout {
    set $prl_handler "gateway_input";
    include /etc/nginx/prl/error-input.conf;
    return 408 '{"error":{"code":"REQUEST_TIMEOUT","message":"Request timed out","request_id":"$request_id"}}';
}
location @too_large {
    set $prl_handler "gateway_input";
    include /etc/nginx/prl/error-input.conf;
    return 413 '{"error":{"code":"PAYLOAD_TOO_LARGE","message":"Request payload too large","request_id":"$request_id"}}';
}
location @throttled {
    set $prl_handler $prl_local_throttle_handler;
    add_header X-Request-ID $request_id always;
    add_header X-Error-Class $prl_local_throttle_error_class always;
    add_header Cache-Control "private, no-store" always;
    add_header Retry-After 60 always;
    return 429 '{"error":{"code":"$prl_local_throttle_code","message":"$prl_local_throttle_message","request_id":"$request_id"}}';
}
location @unavailable {
    set $prl_handler "gateway_failure";
    add_header X-Request-ID $request_id always;
    add_header X-Error-Class service always;
    add_header Cache-Control "private, no-store" always;
    return 503 '{"error":{"code":"SERVICE_UNAVAILABLE","message":"Service temporarily unavailable","request_id":"$request_id"}}';
}
