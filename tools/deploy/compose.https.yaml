# Use instead of compose.local.yaml. TLS files are supplied outside the checkout.
services:
  api:
    networks:
      proxy: {}
      data: {}
      gateway_api: { ipv4_address: 172.30.34.3 }
    environment:
      TRUSTED_GATEWAY_CIDRS: 172.30.34.2/32
      APPLICATION_ORIGIN: ${PRL_HTTPS_ORIGIN:?Set matching public HTTPS origin}
      ENVIRONMENT: demo
      COOKIE_SECURE: 'true'
      COOKIE_DOMAIN: ''
      COOKIE_SAMESITE: lax
      LOGIN_MAX_BODY_BYTES: '4096'
      API_MAX_BODY_BYTES: '32768'

  gateway:
    image: nginx:stable-alpine@sha256:c59d1f8b1e0e42da75be973424cd72e23f7f8adfb54e982f4d1cd0216a5a5576
    entrypoint: [/bin/sh, /usr/local/sbin/prl-gateway-entrypoint]
    environment:
      PRL_GATEWAY_ENVIRONMENT: demo
      SERVICE_RELEASE: ${SERVICE_RELEASE:-development}
    user: '101:101'
    init: true
    read_only: true
    tmpfs: ['/tmp:size=32m,mode=1777']
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    ports: ['${PRL_HTTPS_BIND:-127.0.0.1}:${PRL_HTTPS_PORT:-8443}:8443']
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/gateway-entrypoint.sh:/usr/local/sbin/prl-gateway-entrypoint:ro
      - ./nginx:/etc/nginx/prl:ro
      - ./nginx/https.conf:/etc/nginx/server.conf:ro
      - type: bind
        source: ${PRL_TLS_CERT_FILE:?Set external TLS certificate file path}
        target: /etc/nginx/tls/server.crt
        read_only: true
        bind: { create_host_path: false }
      - type: bind
        source: ${PRL_TLS_KEY_FILE:?Set external TLS key file path}
        target: /etc/nginx/tls/server.key
        read_only: true
        bind: { create_host_path: false }
    networks:
      edge: {}
      proxy: {}
      gateway_api: { ipv4_address: 172.30.34.2 }
    restart: on-failure:3
    mem_limit: 128m
    cpus: 0.5
    pids_limit: 64
    stop_grace_period: 15s
    healthcheck:
      # Public certificate/hostname verification belongs to external smoke checks.
      test:
        [
          CMD,
          wget,
          --no-check-certificate,
          -q,
          -O,
          /dev/null,
          'https://127.0.0.1:8443/health/gateway',
        ]
      interval: 5s
      timeout: 3s
      retries: 6
    logging:
      driver: json-file
      options: { max-size: 10m, max-file: '3' }

networks:
  edge: {}
  gateway_api:
    internal: true
    ipam:
      config: [{ subnet: 172.30.34.0/29 }]
