[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "production-readiness-lab-backend"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "argon2-cffi==25.1.0",
    "SQLAlchemy==2.0.44",
    "asyncmy==0.2.16",
    "cryptography==50.0.2",
    "alembic==1.16.2",
    "Mako==1.3.12",
    "MarkupSafe==3.0.4",
    "click==8.5.0",
    "fastapi==0.143.0",
    "uvicorn==0.54.0",
    "opentelemetry-api==1.45.1",
    "opentelemetry-sdk==1.45.1",
    "opentelemetry-exporter-otlp-proto-http==1.45.1",
    "prometheus-client==0.26.0",
    "pydantic==2.14.1",
    "pydantic-settings==2.15.0",
    "starlette==1.8.0",
    "PyYAML==6.0.3",
    "tzdata==2026.5",
]

[tool.setuptools]
package-dir = {"" = "src/backend"}

[tool.setuptools.packages.find]
where = ["src/backend"]
include = ["app*"]

[tool.setuptools.package-data]
"app.demo" = ["dataset.json"]

[tool.pyright]
include = [
    "src/backend",
    "tests/backend",
    "tools/scripts/export_openapi.py",
    "tools/scripts/check_dependency_advisories.py",
    "tools/scripts/seed_demo.py",
    "tools/backup",
    "tests/recovery",
]
extraPaths = ["src/backend"]
venvPath = "."
venv = ".venv"
pythonVersion = "3.11"

[tool.pytest.ini_options]
testpaths = ["tests/backend"]
pythonpath = ["src/backend", "tests/backend/integration"]
addopts = ["--import-mode=importlib"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
markers = [
    "mysql: requires a dedicated MySQL 8.4 test database",
    "booking_stress: use bounded extended HTTP deadlines for high-concurrency booking tests",
]

[tool.black]
line-length = 100
target-version = ["py311"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src/backend"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
