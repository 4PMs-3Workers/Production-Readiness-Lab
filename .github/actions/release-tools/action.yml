name: Release tooling
description: Install the release harness and versioned OCI clients without credentials
runs:
  using: composite
  steps:
    - uses: actions/setup-python@v7
      with:
        python-version: '3.12'
        cache: pip
    - shell: bash
      run: |
        python -m pip install -r requirements-dev.txt
        python -m pip install -e .
        sudo apt-get update -q
        sudo apt-get install -y --no-install-recommends skopeo=1.13.3+ds1-2ubuntu0.24.04.3
    - uses: oras-project/setup-oras@5e2f2482b30b0cb3e14e67f89a80c88c659a7c63 # v2.0.3
      with:
        version: 1.3.6
    - shell: bash
      run: |
        skopeo --version
        oras version
        docker info --format '{{.ServerVersion}}'
        docker compose version
