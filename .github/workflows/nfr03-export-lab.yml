name: NFR-03 isolated HTTP lab

on:
  workflow_dispatch:
  pull_request:
    branches: [develop, main, codex/bt3-23001952-vt071]
    paths:
      - '.github/workflows/nfr03-export-lab.yml'
      - 'src/backend/**'
      - 'tests/backend/integration/*nfr03*'
      - 'tests/backend/unit/test_nfr03_profile.py'
      - 'tests/load/**'
      - 'tools/load/**'
      - 'tools/deploy/profiles/**'

permissions:
  contents: read

concurrency:
  group: nfr03-lab-${{ github.ref }}
  cancel-in-progress: true

jobs:
  http-lab:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    services:
      mysql:
        image: mysql:8.4.11
        env:
          MYSQL_ROOT_PASSWORD: test-only-password
        ports: ['3306:3306']
        options: >-
          --cpus=1 --memory=1g
          --health-cmd="mysqladmin ping -h 127.0.0.1 -ptest-only-password"
          --health-interval=10s --health-timeout=5s --health-retries=12
    env:
      MYSQL_TEST_URL: mysql+asyncmy://root:test-only-password@127.0.0.1:3306
      PYTHONUTF8: '1'
      BT3_RUN_LOAD: '1'
      NFR03_TRANSPORT: http
      NFR03_SERVER_DIAGNOSTICS: '0'
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12.13'
          cache: pip
      - run: python -m venv .venv
      - run: .venv/bin/python -m pip install -r requirements-dev.txt -e . -e tools/infra/offhost
      - name: Check probe and configuration contracts
        run: |
          .venv/bin/python -m black --check tools/load/export_probe.py tests/load/test_export_probe.py tests/backend/unit/test_nfr03_profile.py tests/backend/integration/nfr03_native.py tests/backend/integration/test_appointment_export_nfr03.py
          .venv/bin/python -m ruff check tools/load/export_probe.py tests/load/test_export_probe.py tests/backend/unit/test_nfr03_profile.py tests/backend/integration/nfr03_native.py tests/backend/integration/test_appointment_export_nfr03.py
          .venv/bin/python -m pyright tools/load/export_probe.py tests/load/test_export_probe.py tests/backend/unit/test_nfr03_profile.py tests/backend/integration/nfr03_native.py tests/backend/integration/test_appointment_export_nfr03.py
          .venv/bin/python -m pytest tests/load tests/backend/unit/test_nfr03_profile.py tests/backend/integration/test_appointment_export.py -q --require-mysql --junitxml=build/nfr03/contracts.xml
          .venv/bin/python - <<'PY'
          from xml.etree import ElementTree as ET
          root = ET.parse('build/nfr03/contracts.xml').getroot()
          assert not any(int(s.get('skipped', 0)) for s in root.iter('testsuite'))
          PY
      - name: Record default baseline without assuming it must fail on Linux
        env:
          NFR03_PROFILE: default
        run: |
          set +e
          .venv/bin/python -m pytest 'tests/backend/integration/test_appointment_export_nfr03.py::test_export_nfr03[production]' -q --require-mysql
          code=$?
          set -e
          test "$code" -le 1
          .venv/bin/python - <<'PY'
          import json
          from pathlib import Path
          reports = [json.loads(p.read_text()) for p in Path('build/nfr03').rglob('report.json')]
          assert len(reports) == 1
          report = reports[0]
          assert report['profile'] == 'default' and report['completed'] and not report['source_dirty']
          assert sum(len(b['samples']) for b in report['bursts']) == 560
          PY
      - name: Require three candidate HTTP runs
        env:
          NFR03_PROFILE: candidate40
        run: |
          for attempt in 1 2 3; do
            .venv/bin/python -m pytest 'tests/backend/integration/test_appointment_export_nfr03.py::test_export_nfr03[production]' -q --require-mysql
          done
          .venv/bin/python - <<'PY'
          import json
          from pathlib import Path
          reports = [json.loads(p.read_text()) for p in Path('build/nfr03').rglob('report.json')]
          candidates = [r for r in reports if r['profile'] == 'candidate40']
          assert len(candidates) == 3
          assert all(r['passed'] and r['completed'] and not r['source_dirty'] for r in candidates)
          PY
      - name: Preserve bounded sanitized evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: nfr03-http-lab-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            build/nfr03/**/report.json
            build/nfr03/**/report.sha256
            build/nfr03/contracts.xml
          if-no-files-found: error
          retention-days: 30
