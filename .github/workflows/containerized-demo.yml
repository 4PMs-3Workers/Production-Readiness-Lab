name: Containerized demo

on:
  pull_request:
    branches: [develop, main]
  push:
    branches: ['feature/**', 'fixbug/**', 'hotfix/**']

permissions:
  contents: read

concurrency:
  group: containerized-demo-${{ github.ref }}
  cancel-in-progress: true

jobs:
  compose-acceptance:
    name: Container, business, telemetry, and lifecycle acceptance
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      CI: 'true'
      NEXT_TELEMETRY_DISABLED: '1'
      RUN_COMPOSE_ACCEPTANCE: '1'
      RUN_GATEWAY_TESTS: '1'
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: package-lock.json

      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: pip

      - name: Use the locked npm version
        run: npm install --global npm@12.2.0

      - name: Install locked JavaScript dependencies
        run: npm ci

      - name: Install backend and acceptance test dependencies
        run: |
          python -m pip install -r requirements-dev.txt
          python -m pip install -e .

      - name: Check workflow and Compose formatting
        run: >-
          npx --no-install prettier --check --ignore-path .prettierignore
          .github/workflows/containerized-demo.yml tools/deploy/*.yaml

      - name: Confirm local Docker and Compose are available
        run: |
          docker info --format '{{.ServerVersion}}'
          docker compose version

      - name: Install Playwright Chromium and Linux dependencies
        run: npx --no-install playwright install --with-deps chromium

      - name: Run required zero-skip container acceptance
        run: |
          python -m pytest tests/containers -q --tb=short --junitxml=build/containerized-demo-tests.xml
          python - <<'PY'
          from xml.etree import ElementTree

          root = ElementTree.parse("build/containerized-demo-tests.xml").getroot()
          skipped = sum(int(suite.get("skipped", "0")) for suite in root.iter("testsuite"))
          if skipped:
              raise SystemExit(f"Container acceptance tests skipped: {skipped}")
          PY
