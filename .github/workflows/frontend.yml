name: Frontend

on:
  pull_request:
    branches: [develop, main]
  push:
    branches: [develop, main, 'feature/**', 'fixbug/**', 'hotfix/**']

permissions:
  contents: read

concurrency:
  group: frontend-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    name: Frontend checks
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      CI: 'true'
      NEXT_TELEMETRY_DISABLED: '1'
      NEXT_PUBLIC_APP_MODE: mock
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: package-lock.json
      - name: Use the project npm version
        run: npm install --global npm@12.2.0
      - name: Install locked dependencies
        run: npm ci
      - name: Check formatting
        run: npm --workspace src/frontend run format:check
      - name: Lint
        run: npm --workspace src/frontend run lint
      - name: Typecheck
        run: npm --workspace src/frontend run typecheck
      - name: Unit and component tests
        run: npm --workspace src/frontend run test
      - name: Production build
        run: npm --workspace src/frontend run build
      - name: Install Playwright Chromium and system dependencies
        run: npx --no-install playwright install --with-deps chromium
      - name: Desktop and mobile E2E tests
        id: e2e
        run: npm --workspace src/frontend run test:e2e
      - name: Preserve E2E report and failure diagnostics
        if: ${{ !cancelled() && (steps.e2e.outcome == 'success' || steps.e2e.outcome == 'failure') }}
        uses: actions/upload-artifact@v7
        with:
          name: frontend-e2e-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            playwright-report/frontend/
            test-results/frontend/
          if-no-files-found: ignore
          retention-days: 7

  frontend-api:
    name: Frontend real API checks
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    services:
      mysql:
        image: mysql:8.4.11
        env:
          MYSQL_ROOT_PASSWORD: test-only-password
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -ptest-only-password"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=12
    env:
      CI: 'true'
      NEXT_TELEMETRY_DISABLED: '1'
      NEXT_PUBLIC_APP_MODE: api
      API_UPSTREAM_URL: http://127.0.0.1:8101
      MYSQL_TEST_URL: mysql+asyncmy://root:test-only-password@127.0.0.1:3306
      PYTHONPATH: src/backend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'
          cache: pip
      - run: npm install --global npm@12.2.0
      - run: npm ci
      - run: python -m pip install -r requirements-dev.txt
      - run: python -m pip install -e .
      - name: Check real E2E harness
        run: |
          python -m black --check tools/scripts/frontend_e2e_backend.py
          python -m ruff check tools/scripts/frontend_e2e_backend.py
      - run: npm --workspace src/frontend run build
      - run: npx --no-install playwright install --with-deps chromium
      - name: Real MySQL desktop and mobile E2E (no skipping)
        id: api-e2e
        run: npm --workspace src/frontend run test:e2e:api
      - name: Preserve redacted real-flow evidence
        if: ${{ !cancelled() && (steps.api-e2e.outcome == 'success' || steps.api-e2e.outcome == 'failure') }}
        uses: actions/upload-artifact@v7
        with:
          name: frontend-api-e2e-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            playwright-report/frontend-api/
            test-results/frontend-api/
          if-no-files-found: error
          retention-days: 7
